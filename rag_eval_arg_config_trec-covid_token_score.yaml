dataset: trec-covid

# Score-only pass: reuse pooleval_trec-covid_token (run with --no-recreate).
profiles:
  - token

query_limit: 50
recreate: false
index_concurrency: 2
predict_question_max_concurrency: 2

k_values: [3, 10, 20]
chunk_fetch_multiplier: 4

pool:
  rel_threshold: 1
  max_distractors_per_query: 100
