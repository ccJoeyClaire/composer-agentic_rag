dataset: msmarco

# MSMARCO profile ablation (dev qrels; pooled subset is small — ~1 gold + distractors per query).
profiles:
  - token
  - semantic
  - semantic_rerank
  - baseline
  - baseline_s2b
  - baseline_hyde
  - baseline_s2b_hyde
  - baseline_predict_q
  - full

query_limit: 50
recreate: true
index_concurrency: 4
predict_question_max_concurrency: 4

k_values: [3, 10, 20]
chunk_fetch_multiplier: 4

pool:
  rel_threshold: 1
  max_distractors_per_query: 100
