dataset: nfcorpus

# Per-dataset overrides: rag_eval_arg_config_hotpotqa.yaml, rag_eval_arg_config_msmarco.yaml, rag_eval_arg_config_trec-covid.yaml
# Run: python -m _eval_.rag_eval.run --config rag_eval_arg_config_hotpotqa.yaml

# NFCorpus profile ablation (see arg_config.yaml for flag definitions).
# Phase 1 (no LLM index): token … baseline_s2b_hyde
# Phase 2 (LLM index): baseline_predict_q, full
profiles:
  - token
  - semantic
  - semantic_rerank
  - baseline
  - baseline_s2b
  - baseline_hyde
  - baseline_s2b_hyde
  - baseline_predict_q
  - full

query_limit: 50
# true: drop + re-index each run. false: reuse collection when it already exists.
recreate: true
# DashScope / Aliyun embedding RPM is low; keep doc-level concurrency modest.
index_concurrency: 4
predict_question_max_concurrency: 4

k_values: [3, 10, 20]
chunk_fetch_multiplier: 4

pool:
  rel_threshold: 1
  max_distractors_per_query: 100
