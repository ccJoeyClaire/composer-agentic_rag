chunker:
  chunk_tokens: 512
  overlap_tokens: 64
  # semantic_chunker
  break_similarity: 0.5
  # small-to-big
  min_chunk_tokens: 120

retriever:
  recall_n: 50
  top_k: 3

# Index-time flags → one Qdrant collection per profile (6 strategies).
# Controls: chunker choice, contextual / predict_q enrich, parent-child (s2b) structure.
index_profiles:
  token:
    use_token_chunker: true

  semantic: {}

  baseline:
    use_contextual: true

  s2b:
    use_contextual: true
    use_small_to_big: true

  predict_q:
    use_contextual: true
    use_predict_questions: true

  full:
    use_contextual: true
    use_small_to_big: true
    use_predict_questions: true

# Query-time flags → no re-index; reuse an index collection (5 strategies).
# s2b retrieve requires an index profile with use_small_to_big.
retrieve_profiles:
  plain: {}

  rerank:
    use_reranker: true

  rerank_contextual:
    use_reranker: true
    use_contextual: true

  rerank_s2b:
    use_reranker: true
    use_contextual: true
    use_small_to_big: true

  rerank_hyde:
    use_reranker: true
    use_contextual: true
    use_hyde: true

  full:
    use_reranker: true
    use_contextual: true
    use_small_to_big: true
    use_hyde: true
    use_predict_questions: true

