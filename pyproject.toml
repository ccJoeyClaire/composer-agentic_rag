[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composer-agentic-rag"
version = "0.1.0"
description = "Pluggable Agent + Tool + RAG harness with LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.44.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.0",
    "pydantic>=2.11.10",
    "typing-extensions>=4.13.0",
    "PyYAML>=6.0.0",
    "tiktoken>=0.9.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.2.0",
    "mcp>=1.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
eval = [
    "ragchecker>=0.1.9",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rag*", "tools*", "llm*"]
exclude = ["tests*", "get_start*", "legacy*", "docs*", "_eval_*"]

[tool.setuptools.package-data]
"agent.prompt" = ["*.yaml"]
