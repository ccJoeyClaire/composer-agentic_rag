# Agent reflection patterns — capability toggles + system_prompt key.
# Prompt bodies live in agent/prompt/system_prompt.yaml.
# RAG deployment (collection, profile_id) comes from RequestConfig at runtime.

# LLM-view RAG context budget. Omit or null → 3 × retriever.top_k (arg_config.yaml).
rag_context:
  max_chunks: null

patterns:
  crag:
    enable_retrieval_gate: true
    enable_rag_profile_router: false
    enable_human_feedback: false

  self_rag:
    enable_retrieval_gate: false
    enable_rag_profile_router: true
    enable_human_feedback: false

  crag_self_rag:
    enable_retrieval_gate: true
    enable_rag_profile_router: true
    enable_human_feedback: false

  feedback:
    enable_retrieval_gate: false
    enable_rag_profile_router: false
    enable_human_feedback: true

  full:
    enable_retrieval_gate: true
    enable_rag_profile_router: true
    enable_human_feedback: true

  react:
    enable_retrieval_gate: false
    enable_rag_profile_router: false
    enable_human_feedback: false
