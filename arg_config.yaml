chunker:
  chunk_tokens: 512
  overlap_tokens: 64
#===== semantic_chunker =====
  break_similarity: 0.5
#====== small-to-big =====
  min_chunk_tokens: 120

retriever:
  recall_n: 50
  top_k: 3

profiles:
  baseline: {}
  token: { use_token_chunker: true }
  contextual: { use_contextual: true }
  s2b: { use_small_to_big: true }
  predict_q: { use_predict_questions: true }
  hyde: { use_hyde: true }
  reranker: { use_reranker: true }
  full:
    use_contextual: true
    use_small_to_big: true
    use_hyde: true
    use_reranker: true
