[pytest]
minversion = 8.0
testpaths = rag agent tools
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: pure logic, no external services
    integration: in-memory Qdrant or heavier wiring
    slow: downloads models or long-running checks
    requires_api: needs EMBEDDING_API_KEY or LLM_API_KEY in environment
    needs_graph_import: requires importing agent.graph (may skip if AgentConfig defaults fail)
    debug_probe: manual dev probe; run with DEBUG_PROBES=1 and pytest -s
